<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BuyBuzz Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#f1f3f6;
  color:#222;
}

/* HEADER */
.header{
  background:#2874f0;
  padding:12px;
  color:white;
}

.topbar{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:15px;
}

.menu{
  font-size:25px;
}

.logo{
  min-width:110px;
}

.logo b{
  font-size:22px;
  font-style:italic;
}

.logo span{
  display:block;
  font-size:11px;
  color:#eee;
}

.logo strong{
  color:#ffe500;
}

.search{
  flex:1;
  background:white;
  height:42px;
  display:flex;
  align-items:center;
  padding:0 12px;
  border-radius:2px;
  color:#555;
}

.search input{
  border:0;
  outline:0;
  width:100%;
  font-size:14px;
  margin-left:8px;
}

.login{
  background:white;
  color:#2874f0;
  border:0;
  padding:10px 25px;
  font-weight:bold;
  border-radius:2px;
}

.cart{
  position:relative;
  font-size:25px;
}

.cart span{
  position:absolute;
  top:-8px;
  right:-10px;
  background:red;
  color:white;
  border-radius:50%;
  font-size:11px;
  width:18px;
  height:18px;
  text-align:center;
  line-height:18px;
}

/* BANNER */
.banner{
  margin:10px auto;
  max-width:1250px;
  min-height:190px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  overflow:hidden;
}

.banner img{
  width:100%;
  height:auto;
  display:block;
}

@media(max-width:600px){
  .banner{
    width:100%;
    min-height:0;
    margin:5px 0;
  }

  .banner img{
    width:100%;
    height:auto;
    display:block;
  }
}


/* ============================= */
/* SHOP CATEGORIES */
/* ============================= */

.shop-categories{
  background:white;
  padding:15px 10px;
  margin:8px 0;
}

.shop-categories h2{
  font-size:24px;
  margin-bottom:15px;
  color:#222;
}

.shop-category-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.shop-category{
  background:white;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.10);
  text-align:center;
  padding:12px 5px;
  min-height:125px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.shop-category .icon{
  width:75px;
  height:75px;
  margin-bottom:7px;
  border-radius:50%;
  overflow:hidden;
  border:3px solid #ffe0d5;
  background:#fff;
}

.shop-category .icon img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  image-rendering:auto;
}

.shop-category p{
  font-size:15px;
  color:#222;
  margin:0;
}


/* SECTION */
.section{
  max-width:1250px;
  margin:10px auto;
  background:white;
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
  border-bottom:1px solid #eee;
}

.sectionTitle h2{
  color:#2874f0;
  font-size:22px;
}

.sectionTitle span{
  color:#2874f0;
  font-weight:bold;
}


/* PRODUCT GRID */
.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
}


/* PRODUCT CARD */
.product{
  background:white;
  border-right:1px solid #eee;
  border-bottom:1px solid #eee;
  padding:12px 10px 18px;
  min-width:0;
  cursor:pointer;
}

.product img{
  width:100%;
  height:210px;
  object-fit:contain;
  display:block;
  background:white;
}

.product h3{
  font-size:17px;
  font-weight:400;
  margin:12px 0 8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.discount{
  color:#388e3c;
  font-size:16px;
  display:inline-block;
  margin-right:8px;
}

.old{
  color:#999;
  text-decoration:line-through;
  display:inline-block;
  font-size:15px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin:12px 0 8px;
}

.assured{
  display:inline-block;
  background:#2874f0;
  color:white;
  border-radius:12px;
  padding:3px 8px;
  font-size:12px;
  font-weight:bold;
  float:right;
}

.rating{
  display:inline-block;
  background:#388e3c;
  color:white;
  padding:2px 6px;
  border-radius:2px;
  font-size:12px;
  font-weight:500;
  margin-top:6px;
}

.ratingCount{
  font-size:12px;
  color:#555;
  margin-left:5px;
}


/* VIEW DEAL BUTTON */
.deal-btn{
  width:100%;
  border:none;
  outline:none;
  margin-top:12px;
  padding:9px 8px;
  border-radius:25px;

  background:linear-gradient(
    90deg,
    #ff7a00 0%,
    #ff4b16 45%,
    #f0008c 100%
  );

  color:white;
  font-size:15px;
  font-weight:bold;
  text-align:center;
  cursor:pointer;
}

.deal-btn span{
  font-size:16px;
  margin-left:4px;
}


/* FOOTER */
footer{
  text-align:center;
  background:#172337;
  color:white;
  padding:30px;
  margin-top:20px;
}


/* MOBILE */
@media(max-width:600px){

  body{
    background:#f1f3f6;
  }

  .header{
    padding:8px;
  }

  .topbar{
    gap:8px;
  }

  .menu{
    font-size:22px;
  }

  .logo{
    min-width:auto;
  }

  .logo b{
    font-size:17px;
  }

  .logo span{
    font-size:8px;
  }

  .search{
    height:38px;
  }

  .search input{
    font-size:11px;
  }

  .login{
    display:none;
  }

  .cart{
    font-size:23px;
  }


  /* CATEGORY MOBILE */

  .shop-categories{
    padding:15px 8px;
  }

  .shop-categories h2{
    font-size:22px;
  }

  .shop-category-grid{
    grid-template-columns:repeat(4,1fr);
    gap:7px;
  }

  .shop-category{
    min-height:105px;
    padding:7px 3px;
  }

  .shop-category .icon{
    width:58px;
    height:58px;
    border-width:3px;
  }

  .shop-category p{
    font-size:12px;
  }


  /* PRODUCTS */

  .section{
    margin:5px 0;
  }

  .sectionTitle{
    padding:14px 12px;
  }

  .sectionTitle h2{
    font-size:18px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:5px;
    background:#f1f3f6;
  }

  .product{
    padding:10px;
    border:0;
  }

  .product img{
    height:190px;
  }

  .product h3{
    font-size:16px;
    margin:10px 0;
  }

  .discount{
    font-size:15px;
  }

  .old{
    font-size:14px;
  }

  .price{
    font-size:19px;
  }

  .assured{
    font-size:10px;
    padding:3px 6px;
  }

  .deal-btn{
    margin-top:10px;
    padding:8px 5px;
    font-size:14px;
    border-radius:24px;
  }

  .deal-btn span{
    font-size:15px;
    margin-left:3px;
  }
}

</style>
</head>
